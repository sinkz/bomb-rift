<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOMB RIFT · Teste dos chefes</title>
<style>body{margin:0;background:#100c19;color:#ffedd5;font:14px system-ui;height:100dvh;display:flex;flex-direction:column}#scene{flex:1;min-height:0;outline:none}header{flex:none;background:#181121;padding:8px 12px;border-bottom:2px solid #987cbe;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}button,select{background:#382949;color:inherit;border:1px solid #aa8cba;padding:8px;margin:2px}p{margin:0}#state{color:#9de6cb}#event{color:#ffe3a6;min-height:1.3em}header>p:nth-of-type(2){font-size:12px}@media(max-width:600px){header{gap:4px;font-size:12px}header>b{display:none}}</style>
<header><b>TESTE DE COMBATE · sem alterar seu progresso</b><p><select id="world" aria-label="Chefe"><option value="1">Mórthos</option><option value="4">Vulkar</option><option value="7">Nyxara</option><option value="10">Briarok</option><option value="13">Fulgra</option><option value="16">Nivor</option></select><button id="restart">Reiniciar chefe</button><button id="pause">Pausar</button></p><p>WASD / setas: mover · Espaço: bomba · Shift: esquiva · vida protegida neste teste</p><p id="state"></p><p id="event"></p></header><div id="scene" tabindex="0" aria-label="Arena de combate"></div>
<script type="module">
window.addEventListener('error',e=>document.querySelector('#state').textContent=e.error?.stack||e.message);
window.addEventListener('unhandledrejection',e=>document.querySelector('#state').textContent=String(e.reason));
import {Game,seededRandom} from './src/game.js';import {ArenaScene} from './src/scene.js';import {bossSources} from './src/boss-sources.js';
const game=new Game({random:seededRandom(13),meta:{unlockedStage:18}});game.start(1);
const scene=new ArenaScene(document.querySelector('#scene'),game,{bossSources});await scene.bossesReady;
const arena=document.querySelector('#scene'),keys=new Set();
function focusArena(){keys.clear();arena.focus({preventScroll:true});}
function start(){document.querySelector('#event').textContent='';document.querySelector('#pause').textContent='Pausar';game.reset(Number(document.querySelector('#world').value));game.phase='playing';game.enemies=[];game.pickups=[];game.player.invincible=99999;game.player.capacity=5;game.player.damage=3;game.player.range=3;game.spawnBoss();game.spawnClock=Infinity;game.hazardClock=Infinity;focusArena();}
document.querySelector('#restart').onclick=start;document.querySelector('#world').onchange=start;document.querySelector('#pause').onclick=()=>{game.pause();document.querySelector('#pause').textContent=game.phase==='paused'?'Continuar':'Pausar';focusArena();};arena.onpointerdown=focusArena;
window.onkeydown=e=>{if(['SELECT','BUTTON'].includes(e.target.tagName))return;keys.add(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat&&e.code==='Space')game.plantBomb();if(!e.repeat&&['ShiftLeft','ShiftRight'].includes(e.code))game.dash();};window.onkeyup=e=>keys.delete(e.code);window.onblur=()=>keys.clear();
start();let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(keys.has('KeyW')||keys.has('ArrowUp'))game.move(0,-1);else if(keys.has('KeyS')||keys.has('ArrowDown'))game.move(0,1);else if(keys.has('KeyA')||keys.has('ArrowLeft'))game.move(-1,0);else if(keys.has('KeyD')||keys.has('ArrowRight'))game.move(1,0);game.tick(dt);if(game.phase==='upgrade')game.chooseSkill(game.offers[0].id);for(const e of game.drainEvents()){scene.handle(e);if(e.type==='warning'||e.type==='arenaRite')document.querySelector('#event').textContent=e.hint||e.name;}scene.update(dt);const b=game.boss;document.querySelector('#state').textContent=b?`${b.name} · ${b.intent} · ${b.hp}/${b.maxHp} HP · posição ${b.x},${b.z} · ${game.anchors.length} runas`:game.phase;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
